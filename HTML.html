<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物件確認｜販売状況・QR管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#172c37;font:15px/1.7 'Segoe UI','Yu Gothic UI',Meiryo,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;border:0;border-radius:8px;padding:10px 17px;font-weight:600}a{color:#126a68;text-decoration:none}header{height:82px;background:white;border-bottom:1px solid #e2e9e9;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{display:flex;align-items:center;gap:13px;font-size:21px;font-weight:750;color:#172c37}.mark{background:#176b65;color:white;border-radius:9px;padding:0 9px;font-size:29px}.brand-sub{font-size:12px;font-weight:400;color:#6a7d84;border-left:1px solid #d9e1e2;padding-left:15px;margin-left:8px}main{max-width:1190px;margin:42px auto;padding:0 26px 60px}.eyebrow{color:#59817e;font-size:11px;font-weight:700;letter-spacing:2px}h1{font-size:29px;letter-spacing:.03em;margin:6px 0 8px}h2{font-size:21px;margin:0}.muted{color:#70818a;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:20px}.primary{background:#176b65;color:white}.primary:hover{background:#0f514c}.secondary{background:white;border:1px solid #d5dfdf;color:#2b5056}.quiet{background:transparent;color:#6c7c84}.notice{background:#fff9eb;border:1px solid #ebdfbd;border-radius:9px;padding:13px 18px;font-size:13px;color:#77613c;margin:22px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.stat{background:white;border:1px solid #e2e8e9;border-radius:12px;padding:20px 24px}.stat strong{font-size:31px;display:block;margin-top:3px}.stat span{font-size:12px;color:#74858c}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:30px 0 16px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{background:transparent;color:#6b7e86;font-size:13px;padding:7px 13px}.filters button.active{background:#dceee9;color:#176b65}.search{max-width:270px;margin:0}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:1fr auto;gap:20px;background:white;border:1px solid #e0e8e9;border-radius:12px;padding:22px 25px}.card h2{font-size:18px;margin:10px 0 2px}.address{color:#71828a;font-size:13px}.card-bottom{display:flex;align-items:center;gap:18px;margin-top:14px;font-size:12px;color:#7d8c91}.card-price{font-size:17px;font-weight:700;color:#233d48}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.actions button,.actions a{font-size:12px;padding:8px 12px}.badge{display:inline-flex;padding:3px 11px;border-radius:30px;font-size:11px;font-weight:700;background:#e4f2eb;color:#277b59}.badge[data-status="商談中"]{background:#fff1d8;color:#997020}.badge[data-status="成約済"]{background:#e8edf1;color:#657585}.badge[data-status="販売停止"]{background:#f4e6e6;color:#936868}.empty{background:white;text-align:center;border:1px dashed #cbdcdb;border-radius:12px;padding:60px 20px}.empty .icon{font-size:42px;color:#78a39a}.empty h2{margin:15px 0 7px}.empty p{color:#788991;font-size:13px;margin-bottom:24px}.help{color:#849298;text-align:center;font-size:12px;margin-top:30px}dialog{border:0;border-radius:15px;box-shadow:0 20px 90px #142f3840;padding:28px;width:min(580px,94vw);max-height:90vh}dialog::backdrop{background:#19333970}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}label{display:block;font-size:13px;font-weight:600;margin:14px 0}label small{color:#a26651;margin-left:6px;font-size:10px}input,select,textarea{display:block;width:100%;border:1px solid #d5dfe2;background:white;color:#253e48;border-radius:7px;padding:10px 12px;margin-top:6px}textarea{resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}#form-error{color:#af4940;font-size:13px}.login{max-width:450px;margin:70px auto;background:white;border:1px solid #dfe7e9;border-radius:14px;padding:35px}.login .primary{width:100%;margin-top:10px}.public{max-width:620px;margin:30px auto;background:white;border:1px solid #dce7e7;border-radius:18px;overflow:hidden}.public-head{padding:36px;background:#edf6f2;text-align:center}.public-head .badge{font-size:22px;padding:8px 28px}.public-body{padding:30px}.public h1{font-size:24px;margin:13px 0}.detail{border-top:1px solid #e5eceb;padding:18px 0;white-space:pre-wrap}.detail b{display:block;font-size:12px;color:#7b8e94;margin-bottom:6px}.fresh{font-size:12px;color:#71858a;margin:15px 0 0}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#173e39;color:white;border-radius:9px;padding:12px 24px;display:none;z-index:10}#qr-content{text-align:center}#qr-content img{width:270px;max-width:100%;display:block;margin:10px auto}#qr-content .primary{display:inline-block;border-radius:7px;padding:10px 20px}#qr-content input{font-size:11px}footer{font-size:12px;color:#8a999d;margin-top:20px}.error{color:#a34a43}@media(max-width:750px){.brand-sub{display:none}header{height:68px}main{margin:25px auto;padding:0 17px 45px}.top{align-items:flex-start}h1{font-size:25px}.top p{font-size:12px}.top .primary{font-size:12px;white-space:nowrap;margin-top:20px}.stats{gap:8px}.stat{padding:14px 12px}.stat strong{font-size:25px}.toolbar{align-items:stretch;flex-direction:column}.search{max-width:none}.card{grid-template-columns:1fr;padding:20px}.actions{border-top:1px solid #eff2f3;padding-top:12px}.card-bottom{flex-wrap:wrap;gap:8px}.two{grid-template-columns:1fr;gap:0}.public-body{padding:23px}}
#documents-dialog{width:min(750px,94vw)}.document-row{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #e3ebeb;padding:15px 0;overflow-wrap:anywhere}.document-row>span{min-width:0}.document-row button{font-size:12px;flex-shrink:0}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}.check input{width:auto;flex-shrink:0;margin-top:6px}.inbox{border-top:1px solid #dce6e5;padding-top:34px;margin-top:40px}.request-card{background:white;border:1px solid #dce6e5;border-radius:12px;padding:24px;margin:14px 0;overflow-wrap:anywhere}.request-heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.request-heading select{width:130px}.request-heading h3{margin:6px 0 15px}.request-card p{font-size:13px}.pre{white-space:pre-wrap}.success{background:#e9f5ed;padding:20px;border-radius:9px}.public .detail{white-space:normal}.public .detail>p,.public .detail .pre{white-space:pre-wrap}@media(max-width:600px){.document-row{align-items:flex-start;flex-direction:column}.request-heading{align-items:flex-start}.request-card{padding:18px}}
</style></head><body><header><a href="#" class="brand"><span class="mark">▦</span>物件確認<span class="brand-sub">販売状況・QR管理</span></a><button id="logout" class="quiet" hidden>ログアウト</button></header><main id="app"><p>読み込み中…</p></main><div id="toast" role="status"></div><dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="form-title">物件を登録</h2><button type="button" class="quiet close" aria-label="閉じる">✕</button></div><label>物件名 <small>必須</small><input name="name" required maxlength="100" placeholder="例：〇〇マンション 301号室"></label><label>所在地<input name="address" maxlength="200" placeholder="例：東京都〇〇区〇〇1-2-3"></label><div class="two"><label>価格<input name="price" maxlength="60" placeholder="例：3,980万円"></label><label>販売状況<select name="status"><option>販売中</option><option>商談中</option><option>成約済</option><option>販売停止</option></select></label></div><label>内見の申込方法<textarea name="viewing" maxlength="400" rows="2" placeholder="申込先・受付方法など"></textarea></label><label>閲覧者へのお知らせ<textarea name="note" maxlength="600" rows="3" placeholder="QRを読み取った方に表示する内容です"></textarea></label><p class="muted">登録した内容は物件確認ページに表示されます。</p><div class="dialog-actions"><button type="button" class="secondary close">キャンセル</button><button type="submit" class="primary">保存する</button></div><p id="form-error" role="alert"></p></form></dialog><dialog id="qr-dialog"><div class="dialog-head"><h2>販売図面用QRコード</h2><button class="quiet" id="qr-close" aria-label="閉じる">✕</button></div><div id="qr-content"></div></dialog><script>const app=document.querySelector('#app'),editor=document.querySelector('#editor'),form=document.querySelector('#form');
let properties=[],session={},filter='すべて',query='',editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const badge=s=>`<span class="badge" data-status="${esc(s)}">● ${esc(s)}</span>`;
const localKey='property-qr-html-v1';
let localDb;try{localDb=JSON.parse(localStorage.getItem(localKey)||'{"properties":[],"documents":[],"requests":[]}')}catch{localDb={properties:[],documents:[],requests:[]}}
function persist(){try{localStorage.setItem(localKey,JSON.stringify(localDb))}catch{throw Error('このブラウザーの保存容量を超えました。資料を小さくしてください。')}}
const uid=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
async function api(url,method='GET',data){
const bits=url.split('/'),id=bits[3],action=bits[4],fileId=bits[5];
if(url==='/api/session')return {authenticated:true,setup:false,publicBase:'',localOnly:true};
if(url==='/api/logout')return {};
if(url==='/api/properties'&&method==='GET')return structuredClone(localDb.properties);
if(url==='/api/properties'&&method==='POST'){const p={...data,id:uid(),updatedAt:new Date().toISOString()};localDb.properties.unshift(p);persist();return p}
if(url==='/api/requests')return localDb.requests.map(x=>({...x,propertyName:localDb.properties.find(p=>p.id===x.propertyId)?.name||'物件'}));
if(bits[2]==='requests'&&method==='PUT'){const r=localDb.requests.find(x=>x.id===id);r.status=data.status;persist();return r}
if(bits[2]==='public'){
const p=localDb.properties.find(x=>x.id===id);if(!p)throw Error('このブラウザーには該当する物件がありません。');
if(action==='requests'&&method==='POST'){
if(!['販売中','商談中'].includes(p.status))throw Error('この物件は内見受付を停止しています');
if(!data.company||!data.person||!data.phone||!/^\S+@\S+\.\S+$/.test(data.email)||data.consent!==true)throw Error('必須項目と同意を確認してください');
for(const key of ['first','second'])if((key==='first'||data[key])&&(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(data[key])||!Number.isFinite(Date.parse(data[key]+'+09:00'))||Date.parse(data[key]+'+09:00')<Date.now()))throw Error('未来の希望日時を日本時間で指定してください');
if(data.first===data.second)throw Error('第1希望と第2希望は別の日時にしてください');
const r={...data,id:uid(),propertyId:id,status:'未対応',createdAt:new Date().toISOString()};localDb.requests.unshift(r);persist();return {receipt:r.id,message:'試作内の受付一覧に保存しました。他社や管理者には送信されません。実際の内見予約ではありません。'};
}return {...p,documents:localDb.documents.filter(d=>d.propertyId===id&&d.visible)};
}
if(bits[2]==='properties'){
if(action==='documents'){
if(method==='GET')return localDb.documents.filter(d=>d.propertyId===id);
if(method==='POST'){if(localDb.documents.filter(d=>d.propertyId===id).length>=20)throw Error('資料は20件までです');let type;if(data.base64.startsWith('JVBERi0'))type='application/pdf';else if(data.base64.startsWith('iVBORw0KGgo'))type='image/png';else if(data.base64.startsWith('/9j/'))type='image/jpeg';else throw Error('PDF・JPEG・PNGを選んでください');const d={...data,id:uid(),propertyId:id,type,size:Math.floor(data.base64.length*3/4)};localDb.documents.push(d);try{persist()}catch(e){localDb.documents.pop();throw e}return d}
if(method==='PUT'){const d=localDb.documents.find(d=>d.id===fileId&&d.propertyId===id);d.visible=data.visible;persist();return d}
}if(method==='PUT'){const i=localDb.properties.findIndex(p=>p.id===id);localDb.properties[i]={...data,id,updatedAt:new Date().toISOString()};persist();return localDb.properties[i]}
}throw Error('HTML試作版ではこの操作は利用できません');
}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}
function login(){app.innerHTML=`<section class="login"><div class="eyebrow">PROPERTY STATUS</div><h1>${session.setup?'はじめての設定':'管理画面にログイン'}</h1><p class="muted">${session.setup?'物件情報を管理するためのパスワードを設定してください。':'登録した物件の販売状況を更新できます。'}</p><form id="login-form"><label>管理用パスワード<input type="password" id="password" required minlength="${session.setup?10:1}" maxlength="128" autocomplete="${session.setup?'new-password':'current-password'}"></label>${session.setup?'<p class="muted">10文字以上で設定してください。大切に保管してください。</p>':''}<button class="primary">${session.setup?'設定してはじめる':'ログイン'}</button><p id="login-error" class="error" role="alert"></p></form></section>`;document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{await api('/api/login','POST',{password:document.querySelector('#password').value});await boot()}catch(err){document.querySelector('#login-error').textContent=err.message}finally{button.disabled=false}}}
async function boot(){session=await api('/api/session');if(!session.authenticated){document.querySelector('#logout').hidden=true;return login()}document.querySelector('#logout').hidden=false;properties=await api('/api/properties');render()}
function render(){const statuses=['販売中','商談中','成約済'];app.innerHTML=`<div class="top"><div><div class="eyebrow">PROPERTY MANAGEMENT</div><h1>物件の管理</h1><p class="muted">販売状況を、QRコードからいつでも確認。</p></div><button class="primary" id="add">＋ 物件を登録</button></div>${session.localOnly?'<div class="notice"><b>試作版・このパソコン専用</b>　HTML操作確認版です。保存先はこのブラウザーのみです。他社とは共有されず、内見依頼は外部送信されません。パスワード保護はありません。</div>':''}<div class="stats"><div class="stat"><span>登録物件</span><strong>${properties.length}<small style="font-size:12px;font-weight:400;margin-left:7px">件</small></strong></div>${statuses.map(s=>`<div class="stat"><span>${s}</span><strong>${properties.filter(p=>p.status===s).length}<small style="font-size:12px;font-weight:400;margin-left:7px">件</small></strong></div>`).join('')}</div><div class="toolbar"><div class="filters">${['すべて',...statuses,'販売停止'].map(s=>`<button data-filter="${s}" class="${filter===s?'active':''}">${s}</button>`).join('')}</div><input class="search" id="search" placeholder="物件名・所在地で検索" aria-label="物件名・所在地で検索" value="${esc(query)}"></div><div id="list" class="list"></div><p class="help">図面のQRコードはそのままで、リンク先の販売状況だけを更新できます。</p>`;document.querySelector('#add').onclick=()=>openEditor();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelector('#search').oninput=e=>{query=e.target.value;renderList()};renderList();addManagement()}
function renderList(){const visible=properties.filter(p=>(filter==='すべて'||p.status===filter)&&(p.name+' '+p.address).toLowerCase().includes(query.toLowerCase()));document.querySelector('#list').innerHTML=visible.length?visible.map(p=>`<article class="card"><div>${badge(p.status)}<h2>${esc(p.name)}</h2><div class="address">${esc(p.address||'所在地未登録')}</div><div class="card-bottom"><span class="card-price">${esc(p.price||'価格未登録')}</span><span>最終更新 ${date(p.updatedAt)}</span></div></div><div class="actions"><a href="#/p/${p.id}" >確認ページ ↗</a><button class="secondary" data-edit="${p.id}">編集・状況変更</button><button class="primary" data-qr="${p.id}">QRを発行</button></div></article>`).join(''):`<section class="empty"><div class="icon">▦</div><h2>${properties.length?'該当する物件がありません':'最初の物件を登録しましょう'}</h2><p>${properties.length?'条件を変えて検索してください。':'物件名と販売状況を登録するだけで、確認ページとQRコードを作成できます。'}</p>${properties.length?'':'<button class="primary" id="first-add">＋ 物件を登録</button>'}</section>`;document.querySelector('#first-add')?.addEventListener('click',()=>openEditor());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>openQr(b.dataset.qr));document.querySelectorAll('[data-edit]').forEach(b=>{const d=document.createElement("button");d.className="secondary";d.textContent="物件資料";d.onclick=()=>openDocuments(b.dataset.edit);b.parentElement.append(d)})}
function openEditor(id){editing=id||null;form.reset();document.querySelector('#form-error').textContent='';document.querySelector('#form-title').textContent=id?'物件情報・販売状況を更新':'物件を登録';if(id){const p=properties.find(x=>x.id===id);for(const k of ['name','address','price','status','viewing','note'])form.elements[k].value=p[k]||''}editor.showModal()}
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;try{const data=Object.fromEntries(new FormData(form));await api('/api/properties'+(editing?'/'+editing:''),editing?'PUT':'POST',data);editor.close();await boot();toast('物件情報を保存しました')}catch(err){document.querySelector('#form-error').textContent=err.message}finally{button.disabled=false}};
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>editor.close());
function openQr(id){const p=properties.find(x=>x.id===id),url=(session.publicBase||location.origin)+'/p/'+id;document.querySelector('#qr-content').innerHTML=`<p><b>${esc(p.name)}</b></p>${session.localOnly?'<div class="notice">試作用QRです。このパソコンでのみ開けます。<br>販売図面への掲載は、公開後に行ってください。</div>':''}<img src="/api/properties/${id}/qr" alt="${esc(p.name)}の販売状況を開くQRコード"><p>最新の販売状況・内見受付はこちら</p><a href="/api/properties/${id}/qr" download="物件確認QR-${id}.svg" class="primary">QRを保存（SVG）</a><label>確認ページのURL<input readonly value="${esc(url)}" aria-label="確認ページのURL"></label><p class="muted">余白を切らずに掲載し、印刷後に読み取りを確認してください。</p>`;document.querySelector('#qr-dialog').showModal()}
document.querySelector('#qr-close').onclick=()=>document.querySelector('#qr-dialog').close();
document.querySelector('#logout').onclick=async()=>{await api('/api/logout','POST');await boot()};
async function publicPage(){
document.querySelector('.brand').setAttribute('href','#');const id=location.hash.slice(1).split('/')[2];
try{const p=await api('/api/public/'+id);app.innerHTML=`<section class="public"><div class="public-head"><div class="eyebrow">LATEST PROPERTY STATUS</div><p class="muted">現在の販売状況</p>${badge(p.status)}<p class="fresh">最終更新：${date(p.updatedAt)}（日本時間）</p></div><div class="public-body"><h1>${esc(p.name)}</h1><p class="address">${esc(p.address)}</p><div class="detail"><b>販売価格</b><strong>${esc(p.price||'お問い合わせください')}</strong></div>${p.viewing?`<div class="detail"><b>内見のご案内</b>${esc(p.viewing)}</div>`:''}${p.note?`<div class="detail"><b>お知らせ</b>${esc(p.note)}</div>`:''}<section class="detail"><h2>物件資料</h2><p class="muted">販売図面・間取り図などをご確認いただけます。</p>${p.documents.length?p.documents.map(d=>`<div class="document-row"><span>${esc(d.name)}<small class="muted">（${(d.size/1024/1024).toFixed(1)} MB）</small></span><div><a href="/api/public/${id}/documents/${d.id}" target="_blank" rel="noopener">閲覧 ↗</a>　<a href="/api/public/${id}/documents/${d.id}?download=1">保存</a></div></div>`).join(''):'<p class="muted">現在、掲載資料はありません。</p>'}</section><section class="detail"><h2>業者様向け 内見依頼</h2>${['販売中','商談中'].includes(p.status)?`<p class="muted">希望日時をお送りください。担当者の連絡をもって日時が確定します。</p><form id="viewing-form"><label>会社名・店舗名 <small>必須</small><input name="company" required maxlength="100" autocomplete="organization"></label><div class="two"><label>担当者名 <small>必須</small><input name="person" required maxlength="80" autocomplete="name"></label><label>電話番号 <small>必須</small><input name="phone" type="tel" required maxlength="40" autocomplete="tel"></label></div><label>メールアドレス <small>必須</small><input name="email" type="email" required maxlength="200" autocomplete="email"></label><div class="two"><label>第1希望（日本時間） <small>必須</small><input name="first" type="datetime-local" required></label><label>第2希望（日本時間）<input name="second" type="datetime-local"></label></div><label>連絡事項<textarea name="message" rows="3" maxlength="600" placeholder="来場人数・ご相談など"></textarea></label><p class="muted">入力した連絡先は、物件の管理者が内見の調整・連絡に使用します。他の閲覧者には表示されません。</p><label class="check"><input name="consent" type="checkbox" required>上記の個人情報の取扱いに同意する</label><button type="submit" class="primary">内見依頼を送信する</button><p id="request-result" role="status"></p></form>`:'<p class="muted">この物件は現在、内見依頼を受け付けていません。</p>'}</section><button class="secondary" id="refresh">最新の状況を確認</button><footer>HTML操作確認版｜申請はこのブラウザーにのみ保存され、外部送信されません。</footer></div></section>`;
document.querySelector('#refresh').onclick=publicPage;
const f=document.querySelector('#viewing-form');if(f)f.onsubmit=async e=>{e.preventDefault();const button=f.querySelector('button');button.disabled=true;const result=document.querySelector('#request-result');try{const b=Object.fromEntries(new FormData(f));b.consent=f.elements.consent.checked;const r=await api('/api/public/'+id+'/requests','POST',b);f.innerHTML=`<div class="success"><b>内見依頼を受け付けました</b><p>${esc(r.message)}</p><small>受付番号：${esc(r.receipt)}</small></div>`}catch(err){result.textContent=err.message;button.disabled=false}};
}catch(err){app.innerHTML=`<section class="empty"><h1>物件を確認できません</h1><p>${esc(err.message)}</p></section>`}}
function addManagement(){const section=document.createElement('section');section.className='inbox';section.innerHTML='<div class="top"><div><h2>内見依頼の受付一覧</h2><p class="muted">申請後、電話・メールで日程を調整してください。状態を変更しても自動連絡は送られません。</p></div><button class="secondary" id="reload-requests">更新する</button></div><div id="request-list">読み込み中…</div>';app.append(section);document.querySelector('#reload-requests').onclick=loadRequests;loadRequests()}
async function loadRequests(){const el=document.querySelector('#request-list');if(!el)return;try{const rows=await api('/api/requests');el.innerHTML=rows.length?rows.map(r=>`<article class="request-card"><div class="request-heading"><div><span class="muted">受付 ${date(r.createdAt)}</span><h3>${esc(r.propertyName)}</h3></div><select data-request="${r.id}" aria-label="${esc(r.company)}の対応状況">${['未対応','調整中','確定','見送り','完了'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div><b>${esc(r.company)} ／ ${esc(r.person)} 様</b><p>電話：${esc(r.phone)}<br>メール：${esc(r.email)}</p><p>第1希望：${esc(r.first.replace('T',' '))}（日本時間）${r.second?'<br>第2希望：'+esc(r.second.replace('T',' '))+'（日本時間）':''}</p>${r.message?`<p class="pre">連絡事項：${esc(r.message)}</p>`:''}<small class="muted">受付番号：${r.id}</small></article>`).join(''):'<div class="empty"><h2>内見依頼はまだありません</h2><p>物件の確認ページから送信された依頼がここに届きます。</p></div>';el.querySelectorAll('[data-request]').forEach(select=>select.onchange=async()=>{select.disabled=true;try{await api('/api/requests/'+select.dataset.request,'PUT',{status:select.value});toast('対応状況を更新しました')}catch(err){toast(err.message);await loadRequests()}finally{select.disabled=false}})}catch(err){el.textContent=err.message}}
const docsDialog=document.createElement('dialog');docsDialog.id='documents-dialog';document.body.append(docsDialog);
async function openDocuments(id){const p=properties.find(x=>x.id===id);try{const docs=await api('/api/properties/'+id+'/documents');docsDialog.innerHTML=`<div class="dialog-head"><h2>物件資料の管理</h2><button class="quiet" id="docs-close" aria-label="閉じる">✕</button></div><p><b>${esc(p.name)}</b></p><div class="notice">「公開中」の資料は、このブラウザーの確認ページに表示されます。外部には公開されません。</div><div>${docs.map(d=>`<div class="document-row"><span>${esc(d.name)}<small class="muted">（${(d.size/1024/1024).toFixed(1)} MB）</small></span><button class="${d.visible?'secondary':'primary'}" data-doc="${d.id}" data-visible="${d.visible}">${d.visible?'公開中 → 非公開にする':'非公開 → 公開する'}</button></div>`).join('')||'<p class="muted">資料はまだ登録されていません。</p>'}</div><form id="upload-form"><label>追加する資料<input id="document-file" type="file" accept=".pdf,.jpg,.jpeg,.png" required></label><p class="muted">PDF・JPEG・PNG ／ 1ファイル10MBまで ／ 1物件20件まで</p><label class="check"><input id="document-visible" type="checkbox">登録と同時に確認ページで公開する</label><button class="primary">資料を登録</button><p id="upload-result" role="status"></p></form>`;document.querySelector('#docs-close').onclick=()=>docsDialog.close();docsDialog.querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/properties/'+id+'/documents/'+b.dataset.doc,'PUT',{visible:b.dataset.visible!=='true'});await openDocuments(id);toast('資料の公開設定を更新しました')}catch(err){toast(err.message);b.disabled=false}});
document.querySelector('#upload-form').onsubmit=async e=>{e.preventDefault();const file=document.querySelector('#document-file').files[0],button=e.target.querySelector('button'),result=document.querySelector('#upload-result');if(!file||file.size>10*1024*1024){result.textContent='10MB以内のファイルを選んでください';return}button.disabled=true;result.textContent='登録しています…';try{const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});await api('/api/properties/'+id+'/documents','POST',{name:file.name,base64,visible:document.querySelector('#document-visible').checked});await openDocuments(id);toast('資料を登録しました')}catch(err){result.textContent=err.message;button.disabled=false}};if(!docsDialog.open)docsDialog.showModal()}catch(err){toast(err.message)}}
function route(){if(location.hash.startsWith('#/p/'))publicPage().then(linkDocuments);else boot().catch(err=>app.textContent=err.message)}
function linkDocuments(){document.querySelectorAll('a[href^="/api/public/"]').forEach(a=>{const id=a.getAttribute('href').split('/')[5].split('?')[0],d=localDb.documents.find(d=>d.id===id&&d.visible);if(!d)return;a.href=URL.createObjectURL(new Blob([Uint8Array.from(atob(d.base64),c=>c.charCodeAt(0))],{type:d.type}));if(a.textContent==='保存')a.download=d.name})}
const originalPublicPage=publicPage;publicPage=async()=>{await originalPublicPage();linkDocuments()};
openQr=()=>{document.querySelector('#qr-content').innerHTML='<div class="notice">このHTMLは操作確認用です。共有できる公開URLがないため、配布用QRは発行できません。公開後にサーバー版でQRを発行してください。</div>';document.querySelector('#qr-dialog').showModal()};
window.addEventListener('hashchange',route);route();
</script></body></html>
