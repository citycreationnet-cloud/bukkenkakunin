<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>物件確認｜販売状況・物件資料・内見依頼</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.8 system-ui,'Yu Gothic',sans-serif;background:#f3f6f5;color:#203a3d}header{background:white;border-bottom:1px solid #dde6e3;padding:20px max(20px,calc((100% - 900px)/2));font-size:20px;font-weight:700}main{max-width:900px;margin:35px auto;padding:0 20px}h1{font-size:26px;margin:0 0 10px}h2{font-size:20px;margin:0 0 14px}.muted{color:#6b7f80;font-size:13px}.card{background:white;border:1px solid #dfe8e4;border-radius:14px;padding:28px;margin-bottom:20px}.status{display:inline-block;background:#e5f3ec;color:#1b7250;border-radius:30px;padding:5px 20px;font-weight:700}.status[data-status="商談中"]{background:#fff0d4;color:#906116}.status[data-status="成約済"],.status[data-status="販売停止"]{background:#eaedef;color:#657578}.status.large{font-size:25px;padding:8px 28px}.hero{text-align:center;background:#edf7f1}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;align-items:center}a{color:#146e64}button,.button{background:#176b60;color:white;border:0;border-radius:8px;padding:11px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:not-allowed}label{display:block;font-size:13px;font-weight:600;margin:14px 0}input,textarea{display:block;margin-top:5px;width:100%;padding:11px;border:1px solid #cbdad5;border-radius:7px;font:inherit}textarea{resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.doc{padding:14px 0;border-top:1px solid #e3eae7}.check{display:flex;gap:10px;align-items:flex-start}.check input{width:auto;margin-top:6px}.note{background:#fff7e5;padding:15px;border-radius:8px;font-size:13px}.pre{white-space:pre-wrap}.error{color:#a33737}footer{text-align:center;color:#7b8c88;font-size:12px;margin:30px 0}.price{font-size:23px;font-weight:700}small{font-weight:400}@media(max-width:600px){.two{grid-template-columns:1fr;gap:0}.card{padding:21px}main{padding:0 14px}h1{font-size:23px}}
</style>
</head>
<body><header id="brand">物件確認</header><main id="app"></main><footer>販売状況は最終更新日時をご確認ください。</footer>

<!-- 公開する情報をここで編集してください。社内情報・パスワード・申請者情報は書かないでください。
properties に物件を追加します。id は印刷後も変更しないでください。
property URL: https://あなたの公開URL/index.html?property=物件のid
status: 販売中 / 商談中 / 成約済 / 販売停止
updatedAt: 最後に販売状況を確認した日時（日本時間の +09:00 を付ける）
資料は同じリポジトリの documents/ にアップロードし、url に相対パスを設定します。

物件1件の記入例（実在物件に書き換えて properties の [] 内へ貼り付け）：
{
  "id": "bukken-001",
  "name": "物件名を入力",
  "address": "所在地を入力",
  "price": "価格を入力",
  "status": "販売中",
  "updatedAt": "2026-11-13T15:00:00+09:00",
  "note": "内見時のご案内など",
  "documents": [{"name": "販売図面", "url": "./documents/bukken-001.pdf"}]
}
-->
<script id="site-data" type="application/json">
{
  "companyName": "株式会社シティクリエイション",
  "contactEmail": "info@city-c.net",
  "properties": [
    {
      "id": "bukken-001",
      "name": "売戸建住宅 小田原市城山4丁目 リフォーム戸建（3LDK）",
      "address": "神奈川県小田原市城山4丁目",
      "price": "3,880万円",
      "status": "販売中",
      "updatedAt": "2026-11-13T16:00:00+09:00",
      "note": "木造2階建／土地 147.70㎡（実測）・建物 90.47㎡／築2003年9月／現況：空家／室内リフォーム済、駐車場土間打ち予定／見学可能です\nJR東海道新幹線・小田原駅 徒歩20分",
      "documents": [{"name": "販売図面", "url": "./documents/bukken-001.pdf"}]
    }
  ]
}
</script>
<script>
'use strict';
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(document.getElementById('site-data').textContent)}catch{app.innerHTML='<section class="card"><h1>設定を確認してください</h1><p>物件データの書式が正しくありません。</p></section>';throw Error('Invalid site data')}
document.getElementById('brand').textContent=data.companyName||'物件確認';
const props=Array.isArray(data.properties)?data.properties:[],statuses=['販売中','商談中','成約済','販売停止'];
const id=new URLSearchParams(location.search).get('property');
function time(x){const d=new Date(x);return Number.isNaN(d.valueOf())?'未設定':d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'（日本時間）'}
function status(p,large=false){const s=statuses.includes(p.status)?p.status:'状況未確認';return `<span class="status ${large?'large':''}" data-status="${esc(s)}">${esc(s)}</span>`}
function safeUrl(raw){try{const url=new URL(raw,location.href);return ['https:','http:'].includes(url.protocol)||(location.protocol==='file:'&&url.protocol==='file:')?url.href:null}catch{return null}}
function render(){
if(!id){app.innerHTML=`<h1>物件の販売状況</h1><p class="muted">物件を選ぶと、最新の販売状況・資料・内見依頼をご確認いただけます。</p>${props.length?props.map(p=>`<section class="card"><div class="row"><div>${status(p)}<h2 style="margin:12px 0 4px">${esc(p.name)}</h2><p class="muted">${esc(p.address)}</p><strong>${esc(p.price)}</strong></div><a class="button" href="?property=${encodeURIComponent(p.id)}">物件を確認する</a></div></section>`).join(''):'<section class="card"><h2>公開中の物件はありません</h2><p class="muted">管理者の方へ：このHTMLの「site-data」に物件情報と連絡先メールを設定してください。</p></section>'}`;return}
const p=props.find(p=>p.id===id);if(!p){app.innerHTML='<section class="card"><h1>物件が見つかりません</h1><p>URLをご確認いただくか、図面の発行元へお問い合わせください。</p><a href="?">物件一覧へ</a></section>';return}
document.title=p.name+'｜販売状況・内見依頼';
const docs=(p.documents||[]).map(d=>({name:d.name,url:safeUrl(d.url)})).filter(d=>d.url);
const email=String(data.contactEmail||'').trim(),hasEmail=/^[^\s@\r\n]+@[^\s@\r\n]+\.[^\s@\r\n]+$/.test(email),open=['販売中','商談中'].includes(p.status);const canMail=hasEmail;
app.innerHTML=`<p><a href="?">← 物件一覧</a></p><section class="card hero"><p class="muted">現在の販売状況</p>${status(p,true)}<p class="muted">最終確認：${esc(time(p.updatedAt))}</p></section><section class="card"><h1>${esc(p.name)}</h1><p class="muted">${esc(p.address)}</p><p class="price">${esc(p.price||'価格はお問い合わせください')}</p>${p.note?`<p class="pre">${esc(p.note)}</p>`:''}<p class="muted">申込・契約のタイミングによって状況が変わる場合があります。</p></section><section class="card"><h2>物件資料</h2>${docs.length?docs.map(d=>`<div class="doc row"><span>${esc(d.name)}</span><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">資料を開く・保存 ↗</a></div>`).join(''):'<p class="muted">現在、掲載資料はありません。</p>'}</section><section class="card" id="req-doc-card"><h2>資料請求</h2>${!canMail?'<p class="muted">資料請求の準備中です。図面の発行元にお問い合わせください。</p>':`<form id="docreq"><label>会社名・店舗名 <small>必須</small><input name="company" required maxlength="100" autocomplete="organization"></label><div class="two"><label>担当者名 <small>必須</small><input name="person" required maxlength="80" autocomplete="name"></label><label>電話番号 <small>必須</small><input name="phone" type="tel" required maxlength="40" autocomplete="tel"></label></div><label>返信先メールアドレス <small>必須</small><input name="email" type="email" required maxlength="200" autocomplete="email"></label><label>ご希望の資料・連絡事項<textarea name="message" rows="3" maxlength="600" placeholder="例：登記簿謄本、収支資料、周辺資料など"></textarea></label><p class="muted">ご連絡先は、物件の管理者が資料送付・連絡のために利用します。</p><label class="check"><input type="checkbox" required>上記の利用目的に同意する</label><button type="submit">メールアプリで資料請求を作成</button><p id="docresult" role="status"></p></form>`}</section><section class="card"><h2>業者様向け 内見依頼</h2>${!open?'<p>現在、内見依頼を受け付けていません。</p>':!hasEmail?'<p class="muted">内見受付の準備中です。図面の発行元にお問い合わせください。</p>':`<p class="note">入力後、メールアプリで依頼内容を確認して送信してください。このページでの入力だけでは送信されません。日時は担当者の返信をもって確定します。</p><form id="request"><label>会社名・店舗名 <small>必須</small><input name="company" required maxlength="100" autocomplete="organization"></label><div class="two"><label>担当者名 <small>必須</small><input name="person" required maxlength="80" autocomplete="name"></label><label>電話番号 <small>必須</small><input name="phone" type="tel" required maxlength="40" autocomplete="tel"></label></div><label>返信先メールアドレス <small>必須</small><input name="email" type="email" required maxlength="200" autocomplete="email"></label><div class="two"><label>第1希望（日本時間） <small>必須</small><input name="first" type="datetime-local" required></label><label>第2希望（日本時間）<input name="second" type="datetime-local"></label></div><label>連絡事項<textarea name="message" rows="3" maxlength="600"></textarea></label><p class="muted">ご連絡先は、物件の管理者が内見調整・連絡のために利用します。</p><label class="check"><input type="checkbox" required>上記の利用目的に同意する</label><button type="submit">メールアプリで内見依頼を作成</button><p id="result" role="status"></p><p class="muted">メールが開かない場合は、${esc(email)} 宛てに物件名・会社名・担当者名・連絡先・希望日時をお送りください。</p></form>`}</section>`;
const form=document.getElementById('request');if(form)form.addEventListener('submit',e=>{e.preventDefault();const b=Object.fromEntries(new FormData(form)),result=document.getElementById('result');for(const key of ['first','second']){if((key==='first'||b[key])&&(!Number.isFinite(Date.parse(b[key]+'+09:00'))||Date.parse(b[key]+'+09:00')<=Date.now())){result.textContent='未来の希望日時を日本時間で指定してください。';return}}if(b.first===b.second){result.textContent='第1希望と第2希望は別の日時にしてください。';return}const body=`内見依頼\n\n物件名：${p.name}\n物件ID：${p.id}\n会社名：${b.company}\n担当者：${b.person}\n電話：${b.phone}\nメール：${b.email}\n第1希望：${b.first.replace('T',' ')}（日本時間）\n第2希望：${b.second?b.second.replace('T',' ')+'（日本時間）':'なし'}\n連絡事項：${b.message||'なし'}\n\n物件ページ：${location.href}\n個人情報の利用目的に同意済み`;location.href='mailto:'+email+'?subject='+encodeURIComponent('【内見依頼】'+p.name)+'&body='+encodeURIComponent(body);result.textContent='メールアプリで送信を完了してください。このページでは送信完了を確認できません。'});
const df=document.getElementById('docreq');if(df)df.addEventListener('submit',e=>{e.preventDefault();const b=Object.fromEntries(new FormData(df));const body=`資料請求\n\n物件名：${p.name}\n物件ID：${p.id}\n会社名：${b.company}\n担当者：${b.person}\n電話：${b.phone}\nメール：${b.email}\nご希望の資料・連絡事項：${b.message||'なし'}\n\n物件ページ：${location.href}\n個人情報の利用目的に同意済み`;location.href='mailto:'+email+'?subject='+encodeURIComponent('【資料請求】'+p.name)+'&body='+encodeURIComponent(body);document.getElementById('docresult').textContent='メールアプリで送信を完了してください。このページでは送信完了を確認できません。'});
}
render();
</script></body></html>
